<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test de versión</title>
<style>
  body {
    font-family: sans-serif;
    background: #0d2740;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
  }
  .box {
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 30px;
    max-width: 400px;
  }
  .big {
    font-size: 60px;
    margin: 10px 0;
  }
  .code {
    font-family: monospace;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 14px;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="big">✅</div>
    <h2>SI VES ESTO, EL ARCHIVO ES NUEVO</h2>
    <p>Código de prueba: <b>CARAMELO-TEST-2026-09-07-A</b></p>
    <p>Hora en que se generó este archivo: <b id="genTime"></b></p>
    <div class="code" id="cacheInfo"></div>
  </div>
  <script>
    document.getElementById('genTime').textContent = "Domingo 7 de Septiembre 2026";
    document.getElementById('cacheInfo').textContent =
      "Cargado ahora: " + new Date().toString();
  </script>
</body>
</html>
